<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FernReader reader (dev)</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 300px 1fr; }
  aside { display: flex; flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; height: 100vh; overflow: hidden; border-right: 1px solid #8884; }
  h1 { font-size: 14px; margin: 0; }
  label { display: grid; grid-template-columns: 76px 1fr 44px; align-items: center; gap: 6px; }
  label select, label input { grid-column: 2 / span 2; min-width: 0; }
  label:has(output) :is(select, input) { grid-column: 2; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; }
  #status, #where, #edit { overflow-wrap: anywhere; }
  #edit { color: #2f7d5b; }
  #log { flex: 1; overflow: auto; font: 11px/1.35 ui-monospace, monospace; border-top: 1px solid #8884; padding-top: 6px; }
  #log div { overflow-wrap: anywhere; margin-bottom: 3px; }
  main { display: flex; align-items: center; justify-content: center; overflow: auto; background: #8882; height: 100vh; }
  #phone { position: relative; flex: none; max-width: 100%; max-height: 100%; box-shadow: 0 2px 16px #0005; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #cutout { position: absolute; top: 0; left: 0; right: 0; background: #0006; pointer-events: none; }
</style>
<script type="module" src="/dev/main.ts"></script>
</head>
<body>
<aside>
  <h1>FernReader reader (dev)</h1>
  <label>Book <select id="book"></select></label>
  <label>Contents <select id="toc"></select></label>
  <label>Progress <input id="fraction" type="range" min="0" max="1" step="0.001" value="0"></label>
  <div class="row"><button id="prev">Previous</button><button id="next">Next</button></div>
  <div class="row"><button id="back" disabled>Link back</button><button id="start">From the start</button></div>
  <label>Flow <select id="flow"><option value="paginated">Paged</option><option value="scrolled">Scrolled</option></select></label>
  <label>Chapters <select id="chapters"><option value="continuous">Continuous</option><option value="one-at-a-time">One at a time</option></select></label>
  <label>Text size <input id="fontScale" type="range" min="0.8" max="2.6" step="0.1"><output id="fontScaleValue"></output></label>
  <label>Margins <input id="marginPercent" type="range" min="0" max="10" step="1"><output id="marginValue"></output></label>
  <label>Line height <input id="lineHeight" type="range" min="1.3" max="2" step="0.1"><output id="lineHeightValue"></output></label>
  <label>Font <select id="fontFamily"><option value="publisher">Publisher</option><option value="literata">Literata</option><option value="source-sans">Source Sans 3</option><option value="atkinson">Atkinson Hyperlegible</option></select></label>
  <label>Align <select id="align"><option value="publisher">Publisher</option><option value="start">Start</option><option value="justify">Justify</option></select></label>
  <label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="black">Black</option><option value="warm">Warm</option></select></label>
  <label>Top inset <input id="topInset" type="range" min="0" max="60" step="1"><output id="topInsetValue"></output></label>
  <label>Animation <select id="pageAnimation"><option value="slide">Slide</option><option value="none">None</option></select></label>
  <label>Viewport <select id="size"><option value="412x915">412 x 915 phone</option><option value="360x640">360 x 640 small phone</option><option value="800x1280">800 x 1280 tablet</option><option value="">Fill</option></select></label>
  <div id="status"></div>
  <div id="where"></div>
  <div id="edit"></div>
  <div id="log"></div>
</aside>
<main><div id="phone"><iframe id="reader" title="Reader"></iframe><div id="cutout"></div></div></main>
</body>
</html>
